#cloud-config
# ============================================================================
# DigitalOcean droplet user-data TEMPLATE (Docker + Antigravity + Nginx).
#
# HOW TO USE:
#   1. Copy this file to a private location as "cloud-config.yaml"
#   2. Fill in your SSH public key (and GH_TOKEN if you use private repos)
#   3. Paste the FILLED file into: Create Droplet -> Advanced Options
#      -> User Data
#   4. After boot, authenticate agy once with Google OAuth:
#        docker exec -it devbox bash
#        agy        # choose Google OAuth, open the URL on your PC, paste the code
#      Then run the bootstrap task manually (see entrypoint.sh step 2).
#
# The host installs Docker + Nginx (reverse proxy :80 -> :3001) and starts
# the "devbox" container with ports 3001 and 5173 published.
# Everything else (tools, Antigravity CLI, projects) lives INSIDE the container.
#
# NEVER commit the filled file anywhere - it contains secrets.
# ============================================================================

users:
  - name: dev
    groups: sudo,docker
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ssh-ed25519 < * * * Paste your public key here * * * >

package_update: true
packages:
  - git
  - docker.io
  - nginx
  - ufw

write_files:
  # Secrets and variables - 0600, root-only, shredded at the end of the run
  - path: /opt/bootstrap/vars.env
    permissions: "0600"
    content: |
      BOOTSTRAP_REPO=https://github.com/mugnol/server-docker-boostrap-agy.git
      GH_TOKEN=
      # GH_TOKEN is optional: fine-grained GitHub PAT, only for private repos.
      # Auth note: agy authenticates via Google OAuth (one interactive login
      # after boot). No Gemini API key is needed or stored anywhere.

  # Nginx reverse proxy: forwards Droplet port 80 -> container port 3001 (HTTP + WebSockets)
  - path: /etc/nginx/sites-available/default
    permissions: "0644"
    content: |
      server {
          listen 80 default_server;
          listen [::]:80 default_server;
          server_name _;

          location / {
              proxy_pass http://127.0.0.1:3001;
              proxy_http_version 1.1;
              proxy_set_header Upgrade $http_upgrade;
              proxy_set_header Connection "upgrade";
              proxy_set_header Host $host;
              proxy_set_header X-Real-IP $remote_addr;
              proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              proxy_set_header X-Forwarded-Proto $scheme;
              proxy_read_timeout 86400s;
              proxy_send_timeout 86400s;
          }
      }

  - path: /opt/bootstrap/run.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      source /opt/bootstrap/vars.env
      DEV_HOME=/home/dev

      # 0. Configure Host Firewall (UFW) and reload Nginx
      ufw allow OpenSSH
      ufw allow 80/tcp
      ufw allow 3001/tcp
      ufw --force enable
      systemctl enable --now docker
      systemctl enable --now nginx
      nginx -t && systemctl reload nginx

      # 1. Fetch the bootstrap repo (Dockerfile, entrypoint.sh, lists)
      sudo -u dev git clone "$BOOTSTRAP_REPO" "$DEV_HOME/bootstrap"

      # 2. Build the devbox image
      cd "$DEV_HOME/bootstrap"
      docker build -t devbox .

      # 3. Start the devbox container with published ports (3001 & 5173).
      #    Secrets are passed as environment variables - never baked into
      #    the image. Projects AND the agy OAuth session
      #    (~/.gemini) live in named volumes so they survive container
      #    recreation.
      docker run -d \
        --name devbox \
        --restart unless-stopped \
        -p 3001:3001 \
        -p 5173:5173 \
        -e GH_TOKEN="${GH_TOKEN:-}" \
        -e RUN_AGY_TASK=false \
        -e COOKIE_SECURE=false \
        -v devbox-projects:/home/dev/projects \
        -v devbox-gemini:/home/dev/.gemini \
        devbox

      # 4. Remove secrets from disk
      shred -u /opt/bootstrap/vars.env 2>/dev/null || rm -f /opt/bootstrap/vars.env

runcmd:
  - /opt/bootstrap/run.sh
