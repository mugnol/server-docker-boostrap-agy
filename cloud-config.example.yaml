#cloud-config
# ============================================================================
# DigitalOcean droplet user-data - deterministic deploy, no agent needed.
#
# Fill in:
#   1. Your SSH public key below
#   2. DOMAIN + LE_EMAIL when you have a domain (HTTPS); leave empty for now
#   3. GH_TOKEN only if repos.txt contains private repos
#
# Everything else lives in the bootstrap repo (BOOTSTRAP_REPO below), which
# run.sh clones at boot - that is the "external reference".
# ============================================================================

users:
  - name: dev
    groups: sudo,docker
    shell: /bin/bash
    sudo: ["ALL=(ALL) NOPASSWD:ALL"]
    ssh_authorized_keys:
      - ssh-ed25519 < * * * Paste your public key here * * * >

package_update: true
packages:
  - git
  - docker.io
  - nginx
  - ufw

write_files:
  - path: /opt/bootstrap/vars.env
    permissions: "0600"
    content: |
      BOOTSTRAP_REPO=https://github.com/mugnol/server-docker-boostrap-agy.git
      GH_TOKEN=
      # Leave empty until you have a domain with an A record to this droplet:
      DOMAIN=
      LE_EMAIL=

  - path: /opt/bootstrap/run.sh
    permissions: "0755"
    content: |
      #!/bin/bash
      set -euo pipefail
      source /opt/bootstrap/vars.env
      DEV_HOME=/home/dev

      # 0. Firewall, Docker, Nginx
      ufw allow OpenSSH
      ufw allow 80/tcp
      ufw allow 443/tcp
      ufw --force enable
      systemctl enable --now docker
      systemctl enable --now nginx

      # 1. "External reference": clone the bootstrap repo and read config
      #    files from it (nginx conf, Dockerfile, entrypoint, repos.txt)
      sudo -u dev git clone "$BOOTSTRAP_REPO" "$DEV_HOME/bootstrap"

      cp "$DEV_HOME/bootstrap/nginx-default.conf" /etc/nginx/sites-available/default
      sed -i "s/__DOMAIN__/${DOMAIN:-_}/" /etc/nginx/sites-available/default
      nginx -t && systemctl reload nginx

      # 2. Build and start the devbox container. The entrypoint clones the
      #    repos from repos.txt and runs each project's start-production.sh
      #    (rpg-virtual-tabletop ships one) - fully deterministic, no agy.
      cd "$DEV_HOME/bootstrap"
      docker build -t devbox .
      docker run -d \
        --name devbox \
        --restart unless-stopped \
        -p 3001:3001 \
        -p 5173:5173 \
        -e GH_TOKEN="${GH_TOKEN:-}" \
        -e RUN_AGY_TASK=false \
        -e COOKIE_SECURE=false \
        -v devbox-projects:/home/dev/projects \
        -v devbox-gemini:/home/dev/.gemini \
        -v devbox-aimemory:/home/dev/.local/share/ai-memory \
        devbox

      # 3. HTTPS only when DOMAIN is set
      if [ -n "${DOMAIN:-}" ] && [ -n "${LE_EMAIL:-}" ]; then
        apt-get install -y certbot python3-certbot-nginx
        certbot --nginx -d "$DOMAIN" --email "$LE_EMAIL" \
          --agree-tos --no-eff-email --redirect --non-interactive
        systemctl enable --now certbot.timer
      fi

      # 4. Remove secrets from disk
      shred -u /opt/bootstrap/vars.env 2>/dev/null || rm -f /opt/bootstrap/vars.env

runcmd:
  - /opt/bootstrap/run.sh
